include classpath("application.conf")
node-address { protocol = https, host = queue, port = 9325, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "127.0.0.1" }
queues {
  jobs-deadletter {}
  jobs {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 1 seconds
    deadLettersQueue { name = "jobs-deadletter", maxReceiveCount = 3 }
  }
}
