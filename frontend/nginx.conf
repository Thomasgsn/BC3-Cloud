server {
 listen 8443 ssl;
 server_name localhost bc3.local front;
 ssl_certificate /run/secrets/server.crt;
 ssl_certificate_key /run/secrets/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ {
  proxy_pass https://api:8443;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /run/secrets/ca.crt;
  proxy_ssl_server_name on;
  proxy_ssl_name api;
  proxy_set_header Host api;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location = /health { access_log off; return 200 'ready'; add_header Content-Type text/plain; }
}
